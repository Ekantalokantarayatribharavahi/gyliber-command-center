services:
  - type: web
    name: gyliber-command-center
    runtime: go
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd .. && go mod tidy && go build -o gyliber-command-center ./backend
    startCommand: ./gyliber-command-center
    healthCheckPath: /api/system/status
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: DB_PATH
        value: gyliber_command_center.db
