name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Go
        run: |
          gofmt -w backend/main.go
          go mod download
          go vet ./...
          go test ./...
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
